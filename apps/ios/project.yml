# XcodeGen spec for the Shidou iOS app. The .xcodeproj is generated, not
# checked in — run `xcodegen generate` in this directory (brew install
# xcodegen) after cloning or after editing this file.
name: Shidou
options:
  bundleIdPrefix: dev.shidou
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 2Z79866758
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: complete
    # Every user-facing string goes through Localizable.xcstrings from here
    # on; emitting them at build time is what keeps the catalog honest.
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
packages:
  ShidouKit:
    path: Packages/ShidouKit
targets:
  Shidou:
    type: application
    platform: iOS
    sources:
      - Shidou/Sources
      - Shidou/Resources
    dependencies:
      - package: ShidouKit
        products:
          - ShidouProtocol
          - ShidouClient
          - ShidouSession
          - ShidouMarkdown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.shidou.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        # App Store Connect rejects an upload without both. TestFlight builds
        # keep MARKETING_VERSION until an App Store update and increase
        # CURRENT_PROJECT_VERSION globally. `bun run ship ios` resolves and
        # stamps the next build number; these values keep manual archives on
        # the latest delivered baseline. See docs/releasing-ios.md.
        MARKETING_VERSION: 0.2.13
        CURRENT_PROJECT_VERSION: 2027
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Shidou/Info.plist
      properties:
        CFBundleDisplayName: Shidou
        # Resolved from the build settings above at compile time, so the
        # plist itself never goes stale.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # BYO-daemon over cleartext ws:// to LAN/Tailscale addresses; ATS
        # blocks these without the local-networking exemption. See
        # docs/ios-appstore-constraints.md (research branch) and issue #5.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          # `NSAllowsLocalNetworking` exempts loopback, link-local, `.local`,
          # and the RFC 1918 blocks — but not `100.64.0.0/10`, where Tailscale
          # assigns from. A cleartext `ws://` to a tailnet IP therefore fails
          # ATS with -1022, and no arbitrary-loads key can rescue it: iOS
          # ignores `NSAllowsArbitraryLoads` once any of the narrower keys is
          # declared. MagicDNS names are the way through, so the daemon
          # advertises `*.ts.net` rather than the tailnet IP. Tailnet traffic
          # is WireGuard-encrypted below the socket. See issue #13.
          NSExceptionDomains:
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
        NSLocalNetworkUsageDescription: >-
          Shidou connects to the Shidou daemon running on your own computer
          over your local network.
        NSCameraUsageDescription: >-
          Shidou uses the camera to scan the pairing code shown by the Shidou
          app on your computer, and to take a photo to attach to a prompt.
        # Pairing is a `shidou://pair` URL: the QR the desktop renders, and a
        # tapped link. See issue #4.
        CFBundleURLTypes:
          - CFBundleURLName: dev.shidou.ios.pairing
            CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - shidou
        ITSAppUsesNonExemptEncryption: false
  ShidouTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Shidou/Tests
    dependencies:
      - target: Shidou
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.shidou.ios.tests
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
  # Navigation coverage for the surfaces, settings and iPad inspector. It runs
  # against a local `shidou-demo` on loopback, which is the same daemon the
  # debug build's "Try the demo" leads with — so the tests drive real protocol
  # traffic, like every other test in this project.
  ShidouUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Shidou/UITests
    dependencies:
      - target: Shidou
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.shidou.ios.uitests
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
