# XcodeGen spec for the Shidou iOS app. The .xcodeproj is generated, not
# checked in — run `xcodegen generate` in this directory (brew install
# xcodegen) after cloning or after editing this file.
name: Shidou
options:
  bundleIdPrefix: dev.shidou
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 2Z79866758
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: complete
packages:
  ShidouKit:
    path: Packages/ShidouKit
  # PROTOTYPE dependency for the streaming transcript spike (wayfinder #9);
  # stays when the real transcript lands (decision #6 chose swift-markdown).
  swift-markdown:
    url: https://github.com/swiftlang/swift-markdown
    from: 0.4.0
targets:
  Shidou:
    type: application
    platform: iOS
    sources:
      - Shidou/Sources
      - Shidou/Resources
    dependencies:
      - package: ShidouKit
        products:
          - ShidouProtocol
          - ShidouClient
          - ShidouSession
      - package: swift-markdown
        products:
          - Markdown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.shidou.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Shidou/Info.plist
      properties:
        CFBundleDisplayName: Shidou
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # BYO-daemon over cleartext ws:// to LAN/Tailscale addresses; ATS
        # blocks these without the local-networking exemption. See
        # docs/ios-appstore-constraints.md (research branch) and issue #5.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: >-
          Shidou connects to the Shidou daemon running on your own computer
          over your local network.
        ITSAppUsesNonExemptEncryption: false
