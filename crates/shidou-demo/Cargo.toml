[package]
name = "shidou-demo"
version = "0.1.0"
edition = "2024"
description = "Public fixture daemon serving Shidou's scripted Demo Session"
license = "GPL-3.0-only"
readme = "README.md"

[[bin]]
name = "shidou-demo"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
parking_lot = "0.12"
serde_json = "1.0"
uuid = { version = "1.18", features = ["v4", "serde"] }
shidou-core = { path = "../shidou-core" }
shidou-protocol = { path = "../shidou-protocol" }

[dev-dependencies]
crossbeam-channel = "0.5"
shidou-client = { path = "../shidou-client" }
